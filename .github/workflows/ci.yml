name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm run check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python mock-boundary tests
        run: python -m unittest discover -s test_py -p "test_*.py"

      - name: Compile Python sources
        run: python -m compileall -q comfyui_jev_sparse test_py
